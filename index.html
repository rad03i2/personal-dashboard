<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Privacy-first local dashboard for tasks, notes, habits and focus."><title>Personal Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><header><div><p class="eyebrow">LOCAL · PRIVATE · SIMPLE</p><h1>Personal Dashboard</h1><p id="date"></p></div><div class="actions"><button id="export">Export</button><label class="button">Import<input id="import" type="file" accept="application/json" hidden></label><button id="theme" aria-label="Toggle theme">◐</button></div></header><main><section class="stats" id="stats"></section><div class="grid"><section class="card"><h2>Tasks</h2><form id="taskForm"><input id="taskInput" maxlength="160" placeholder="What needs doing?" required><button>Add</button></form><ul id="tasks"></ul></section><section class="card"><h2>Habits</h2><form id="habitForm"><input id="habitInput" maxlength="100" placeholder="Daily habit" required><button>Add</button></form><ul id="habits"></ul></section><section class="card"><h2>Quick notes</h2><form id="noteForm"><textarea id="noteInput" maxlength="2000" placeholder="Capture a thought…" required></textarea><button>Add note</button></form><div id="notes"></div></section><section class="card focus"><h2>Focus</h2><div id="timer">25:00</div><div class="row"><button id="start">Start 25 min</button><button id="reset" class="secondary">Reset</button></div><p>Completed focus today: <strong id="focusTotal">0 min</strong></p></section></div></main><footer>Data stays in this browser · Radwan Abdulhadi Ahmed · @rad03i2</footer><script type="module" src="src/app.js"></script></body></html>
